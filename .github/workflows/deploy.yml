name: Deploy to Firebase

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ----- FUNCTIONS -----

      - name: Generate Functions lockfile if missing
        working-directory: ./functions
        run: |
          if [ ! -f package-lock.json ]; then
            echo "functions/package-lock.json puuttuu — generoidaan"
            npm install --package-lock-only
          fi

      - name: Install Functions dependencies
        working-directory: ./functions
        run: npm ci

      - name: Build Functions
        working-directory: ./functions
        run: npm run build

      # ----- WEBAPP (skipataan jos package.json puuttuu) -----

      - name: Check if webapp exists
        id: webapp_check
        run: |
          if [ -f webapp/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "webapp/package.json puuttuu — frontend-build ohitetaan"
          fi

      - name: Generate Webapp lockfile if missing
        if: steps.webapp_check.outputs.exists == 'true'
        working-directory: ./webapp
        run: |
          if [ ! -f package-lock.json ]; then
            echo "webapp/package-lock.json puuttuu — generoidaan"
            npm install --package-lock-only
          fi

      - name: Install Frontend dependencies
        if: steps.webapp_check.outputs.exists == 'true'
        working-directory: ./webapp
        run: npm ci

      - name: Build Frontend
        if: steps.webapp_check.outputs.exists == 'true'
        working-directory: ./webapp
        run: npm run build
        # VITE_API_BASE_URL EI ASETETA — api.ts käyttää relatiivista '/api',
        # joka reititetään Firebase Hosting rewrite:n kautta Cloud Function 'api':lle.
        # Sama koodi toimii niin pallonetti-fi.web.app:ssä kuin custom domainissa.

     # ----- DEPLOY -----
      - name: Create functions/.env from secret
        run: |
          echo "RAPIDAPI_KEY=${{ secrets.RAPIDAPI_KEY }}" > functions/.env
          echo "ADMIN_KEY=${{ secrets.ADMIN_KEY }}" >> functions/.env
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v15.18.0
        with:
          args: deploy --only hosting,firestore,functions:api,functions:scheduledDataRefresh,functions:scheduledCacheCleanup,functions:scheduledVeikkausliigaScrape,functions:refreshData
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: pallonetti-fi
