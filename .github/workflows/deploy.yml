name: Deploy to Firebase

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ----- FUNCTIONS -----

      - name: Generate Functions lockfile if missing
        working-directory: ./functions
        run: |
          if [ ! -f package-lock.json ]; then
            echo "functions/package-lock.json puuttuu — generoidaan"
            npm install --package-lock-only
          fi

      - name: Install Functions dependencies
        working-directory: ./functions
        run: npm ci

      - name: Build Functions
        working-directory: ./functions
        run: npm run build

      # ----- WEBAPP (skipataan jos package.json puuttuu) -----

      - name: Check if webapp exists
        id: webapp_check
        run: |
          if [ -f webapp/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "webapp/package.json puuttuu — frontend-build ohitetaan"
          fi

      - name: Generate Webapp lockfile if missing
        if: steps.webapp_check.outputs.exists == 'true'
        working-directory: ./webapp
        run: |
          if [ ! -f package-lock.json ]; then
            echo "webapp/package-lock.json puuttuu — generoidaan"
            npm install --package-lock-only
          fi

      - name: Install Frontend dependencies
        if: steps.webapp_check.outputs.exists == 'true'
        working-directory: ./webapp
        run: npm ci

      - name: Build Frontend
        if: steps.webapp_check.outputs.exists == 'true'
        working-directory: ./webapp
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.FIREBASE_API_URL }}

      # ----- DEPLOY -----

      - name: Create functions/.env from secret
        run: |
          echo "RAPIDAPI_KEY=${{ secrets.RAPIDAPI_KEY }}" > functions/.env

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions,firestore --project pallonetti-fi --force
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: pallonetti-fi
