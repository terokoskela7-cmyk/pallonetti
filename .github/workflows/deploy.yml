name: Deploy to Firebase

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ----- FUNCTIONS -----

      - name: Generate Functions lockfile if missing
        working-directory: ./functions
        run: |
          if [ ! -f package-lock.json ]; then
            echo "functions/package-lock.json puuttuu — generoidaan"
            npm install --package-lock-only
          fi

      - name: Install Functions dependencies
        working-directory: ./functions
        run: npm ci

      # Lint ennen buildia: kaantaja ei huomaa kayttamatonta importtia,
      # joten se paatyi mainiin asti. Askel ajetaan myos pull_request-
      # ajossa, joten virhe pysahtyy PR:aan eika deployhin.
      - name: Lint Functions
        working-directory: ./functions
        run: npm run lint

      - name: Build Functions
        working-directory: ./functions
        run: npm run build

      # ----- WEBAPP (skipataan jos package.json puuttuu) -----

      - name: Check if webapp exists
        id: webapp_check
        run: |
          if [ -f webapp/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "webapp/package.json puuttuu — frontend-build ohitetaan"
          fi

      - name: Generate Webapp lockfile if missing
        if: steps.webapp_check.outputs.exists == 'true'
        working-directory: ./webapp
        run: |
          if [ ! -f package-lock.json ]; then
            echo "webapp/package-lock.json puuttuu — generoidaan"
            npm install --package-lock-only
          fi

      - name: Install Frontend dependencies
        if: steps.webapp_check.outputs.exists == 'true'
        working-directory: ./webapp
        run: npm ci

      - name: Build Frontend
        if: steps.webapp_check.outputs.exists == 'true'
        working-directory: ./webapp
        run: npm run build
        # VITE_API_BASE_URL EI ASETETA — api.ts käyttää relatiivista '/api',
        # joka reititetään Firebase Hosting rewrite:n kautta Cloud Function 'api':lle.
        # Sama koodi toimii niin pallonetti-fi.web.app:ssä kuin custom domainissa.

     # ----- DEPLOY -----
      - name: Create functions/.env from secret
        # HUOM: ensimmainen rivi kirjoittaa tiedoston (>) ja loput lisaavat
        # siihen (>>). Jos talle listalle lisataan tai siita poistetaan
        # rivi, ensimmaisen on aina oltava > — muuten .env jaa luomatta.
        run: |
          echo "ADMIN_KEY=${{ secrets.ADMIN_KEY }}" > functions/.env
      - name: Deploy to Firebase
        # Vain mainiin pushaaminen deployaa. Workflow kuuntelee myös
        # pull_request-tapahtumaa, jotta build ja testit ajetaan PR:ssä —
        # ilman tätä ehtoa PR:n avaaminen deployaisi tuotantoon ennen
        # katselmointia ja yhdistämistä.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # --only listaa eksplisiittisesti deployattavat funktiot. Listalla
        # ovat vain ne, jotka ovat koodissa: nimi jota koodissa ei ole
        # kaataa deployn. Firebaseen jaaneet vanhat funktiot
        # (scheduledDataRefresh, refreshData, scheduledTransfermarktLeague,
        # scheduledTransfermarktU23) poistetaan erillisella komennolla.
        # --force asettaa cleanup-politiikan automaattisesti (ei interaktiivista
        # promptia funktioiden artefakteista).
        continue-on-error: false
        uses: w9jds/firebase-action@v15.18.0
        with:
          args: deploy --only hosting,firestore,functions:api,functions:scheduledCacheCleanup,functions:scheduledVeikkausliigaScrape --force
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: pallonetti-fi
